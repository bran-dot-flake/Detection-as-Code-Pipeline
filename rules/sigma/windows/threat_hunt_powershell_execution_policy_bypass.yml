title: PowerShell Execution Policy Bypass Argument
id: d9352d96-0c81-46a4-a9c1-32e238d6e08b
status: experimental
description: Detects PowerShell launched with command-line variants requesting the Bypass execution policy, as observed during the investigation.
author: Detection-as-Code Lab
date: '2026-11-09'
references:
  - https://github.com/bran-dot-flake/Threat-Hunting-with-Splunk-Hack-The-Box-Writeup
logsource:
  category: process_creation
  product: windows
detection:
  selection_image:
    Image|endswith:
      - '\powershell.exe'
      - '\pwsh.exe'
  selection_bypass:
    CommandLine|contains:
      - ' -ep bypass'
      - ' -exec bypass'
      - ' -executionpolicy bypass'
  condition: selection_image and selection_bypass
fields:
  - Image
  - CommandLine
  - ParentImage
  - User
falsepositives:
  - Administrative scripts or troubleshooting sessions that intentionally use execution-policy Bypass.
level: medium
tags:
  - attack.execution
  - attack.t1059.001
