name: Detection as Code

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

env:
  RSIGMA_VERSION: '0.25.0'

jobs:
  validate-and-backtest:
    name: Validate and test Sigma rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python test dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate test fixtures and expectations structure
        run: python -m pytest -q tests/test_fixtures.py
      - name: Install pinned RSigma release
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/rsigma.tar.gz"
          extract_dir="${RUNNER_TEMP}/rsigma-extract"
          mkdir -p "${extract_dir}"
          curl --fail --location --silent --show-error -o "${archive}" \
            "https://github.com/timescale/rsigma/releases/download/v${RSIGMA_VERSION}/rsigma-x86_64-unknown-linux-gnu.tar.gz"
          tar --no-same-owner --no-same-permissions -xzf "${archive}" -C "${extract_dir}"
          sudo install -m 0755 "${extract_dir}/rsigma" /usr/local/bin/rsigma
          rsigma --version
      - name: Check Sigma rules are valid
        run: rsigma rule validate rules/sigma/
      - name: Test rule matches against good and bad events
        run: |
          rsigma rule backtest \
            --rules rules/sigma/ \
            --corpus tests/sample-logs/ \
            --expectations ci/expectations.yml \
            --unexpected fail \
            --junit backtest.xml
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: detection-test-results
          path: backtest.xml
          if-no-files-found: ignore

  convert-to-splunk:
    name: Compile rules to Splunk SPL
    needs: [validate-and-backtest]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Sigma CLI and Splunk backend
        run: |
          python -m pip install -r requirements.txt -r requirements-conversion.txt
          sigma list targets
      - name: Convert all rules with the Splunk Windows processing pipeline
        run: python scripts/build_splunk.py
      - name: Publish passing SPL build
        uses: actions/upload-artifact@v4
        with:
          name: splunk-detections-${{ github.sha }}
          path: dist/splunk/
          if-no-files-found: error

  verify-promotion:
    name: Verify main promotion path
    needs: [validate-and-backtest, convert-to-splunk]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Allow explicit manual redeploy
        if: github.event_name == 'workflow_dispatch'
        run: echo "Manual deployment of the current main branch is explicitly allowed."

      - name: Require push to main to come from a merged pull request
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/commits/${COMMIT_SHA}/pulls")"

          RESPONSE="${response}" python - <<'PY'
          import json
          import os
          import sys

          pulls = json.loads(os.environ["RESPONSE"])
          merged_to_main = [
              pr for pr in pulls
              if pr.get("merged_at")
              and pr.get("base", {}).get("ref") == "main"
          ]

          if not merged_to_main:
              print("ERROR: This push to main is not associated with a merged pull request.")
              print("Automatic Splunk deployment is blocked.")
              sys.exit(1)

          numbers = ", ".join(f"#{pr['number']}" for pr in merged_to_main)
          print(f"Verified merged pull request association: {numbers}")
          PY

  deploy-to-splunk-lab:
    # Only executes when explicitly enabled, on trusted main-branch pushes.
    # Do not expose port 8089 or self-hosted runners to untrusted PR code.
    name: Deploy to private Splunk lab (optional)
    needs: [validate-and-backtest, convert-to-splunk, verify-promotion]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && vars.ENABLE_SPLUNK_DEPLOY == 'true'
    runs-on: [self-hosted, linux, splunk-lab]
    environment: splunk-lab
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Create deployment virtual environment
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: splunk-detections-${{ github.sha }}
          path: dist/splunk
      - name: Verify compiled SPL against live Splunk
        env:
          SPLUNK_MANAGEMENT_URL: ${{ secrets.SPLUNK_MANAGEMENT_URL }}
          SPLUNK_TOKEN: ${{ secrets.SPLUNK_TOKEN }}
          SPLUNK_INDEX: ${{ vars.SPLUNK_TEST_INDEX }}
          SPLUNK_VERIFY_TLS: ${{ vars.SPLUNK_VERIFY_TLS }}
        run: .venv/bin/python scripts/test_splunk_integration.py
      - name: Deploy approved saved searches via Splunk REST API
        env:
          SPLUNK_MANAGEMENT_URL: ${{ secrets.SPLUNK_MANAGEMENT_URL }}
          SPLUNK_TOKEN: ${{ secrets.SPLUNK_TOKEN }}
          SPLUNK_INDEX: ${{ vars.SPLUNK_INDEX }}
          SPLUNK_VERIFY_TLS: ${{ vars.SPLUNK_VERIFY_TLS }}
          SPLUNK_APP: search
        run: .venv/bin/python scripts/deploy_splunk.py --live
