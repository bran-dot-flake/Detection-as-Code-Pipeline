name: Detection Health

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read

jobs:
  splunk-health:
    name: Check deployed Splunk detection health
    if: github.ref == 'refs/heads/main' && vars.ENABLE_SPLUNK_DEPLOY == 'true'
    runs-on: [self-hosted, linux, splunk-lab]
    environment: splunk-lab
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Create health-check virtual environment
        run: |
          python3 -m venv .venv-health
          .venv-health/bin/python -m pip install --upgrade pip
          .venv-health/bin/python -m pip install -r requirements.txt

      - name: Query Splunk detection health
        env:
          SPLUNK_MANAGEMENT_URL: ${{ secrets.SPLUNK_MANAGEMENT_URL }}
          SPLUNK_TOKEN: ${{ secrets.SPLUNK_TOKEN }}
          SPLUNK_VERIFY_TLS: ${{ vars.SPLUNK_VERIFY_TLS }}
          SPLUNK_APP: search
        run: .venv-health/bin/python scripts/check_splunk_health.py --report-dir reports

      - name: Publish health summary
        if: always()
        run: |
          if [ -f reports/splunk-health.md ]; then
            cat reports/splunk-health.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload health report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: splunk-detection-health-${{ github.sha }}
          path: reports/
          if-no-files-found: error
